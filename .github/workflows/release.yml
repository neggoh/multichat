name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multichat-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multichat-windows/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Checar sintaxe
        run: npm run check

      - name: Gerar executável portátil
        run: npm run dist

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" dist/*.exe --title "MultiChat ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
