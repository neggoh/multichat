name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-multi-ia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-multi-ia/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/chat_multi_ia
          OPENROUTER_API_KEY: placeholder
          NEXT_TELEMETRY_DISABLED: "1"

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: multichat-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multichat-windows/package-lock.json

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Checar sintaxe
        run: npm run check
